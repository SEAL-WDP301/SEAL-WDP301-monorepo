name: CI/CD Pipeline - SEAL Hackathon Platform

on:
  push:
    branches:
      - dev
      - production
  pull_request:
    branches:
      - dev
      - production

env:
  REGISTRY: ghcr.io

jobs:
  # ============================================================================
  # JOB 0A: Parallel Backend Tests & TypeCheck Gate (Runs on BOTH dev & production)
  # ============================================================================
  test-backend:
    name: BE TypeCheck & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install BE Dependencies & Generate Prisma
        run: |
          cd BE
          npm ci
          npx prisma generate

      - name: Run Backend TypeCheck
        run: |
          cd BE
          npx tsc --noEmit

      - name: Run Backend Unit Tests
        run: |
          cd BE
          npm run test

  # ============================================================================
  # JOB 0B: Parallel Frontend Tests & TypeCheck Gate (Runs on BOTH dev & production)
  # ============================================================================
  test-frontend:
    name: FE TypeCheck & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install FE Dependencies
        run: |
          cd FE
          npm ci

      - name: Run Frontend TypeCheck
        run: |
          cd FE
          npx tsc --noEmit

      - name: Run Frontend Unit Tests
        run: |
          cd FE
          npm run test

  # ============================================================================
  # JOB 1: Build & Push Backend Docker Image (ONLY ON PRODUCTION PUSH)
  # ============================================================================
  build-backend:
    name: Build & Push Backend Docker Image
    needs: [test-backend]
    if: github.ref == 'refs/heads/production' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Owner Name
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./BE
          file: ./BE/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/be:latest
            ghcr.io/${{ env.OWNER_LC }}/be:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ============================================================================
  # JOB 2: Build & Push Frontend Docker Image (ONLY ON PRODUCTION PUSH)
  # ============================================================================
  build-frontend:
    name: Build & Push Frontend Docker Image
    needs: [test-frontend]
    if: github.ref == 'refs/heads/production' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Owner Name
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./FE
          file: ./FE/Dockerfile
          push: true
          build-args: |
              NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/fe:latest
            ghcr.io/${{ env.OWNER_LC }}/fe:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ============================================================================
  # JOB 3: Update Manifests & Trigger Auto-Sync Rollout (ONLY ON PRODUCTION PUSH)
  # ============================================================================
  update-manifests:
    name: Update K8s Manifests & Trigger GitOps Rollout
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/production' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Owner Name
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Update Backend Manifest Image Tag
        run: |
          sed -i "s|image: ghcr.io/.*|image: ghcr.io/${{ env.OWNER_LC }}/be:${{ github.sha }}|g" k8s/base/backend/deployment.yaml

      - name: Update Frontend Manifest Image Tag
        run: |
          sed -i "s|image: ghcr.io/.*|image: ghcr.io/${{ env.OWNER_LC }}/fe:${{ github.sha }}|g" k8s/base/frontend/deployment.yaml

      - name: Commit & Push Updated Manifests
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/base/backend/deployment.yaml k8s/base/frontend/deployment.yaml
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(gitops): update image tags to ${{ github.sha }} [skip ci]" && git push)

