apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: traefik-metrics-monitor
  namespace: monitoring
  labels:
    release: prometheus
spec:
  jobLabel: traefik
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  namespaceSelector:
    matchNames:
      - kube-system
  podMetricsEndpoints:
    - port: metrics
      interval: 10s
